# Backend routes extension for BT / Nginx.
#
# Put this file's content into the BT site extension include, for example:
# /www/server/panel/vhost/nginx/extension/<SITE_NAME>/aoju_backend_routes.conf
#
# Replace:
# - <BACKEND_PORT> with the FastAPI port, usually 38000
# - <AOJ_PROXY_SHARED_SECRET> with backend AOJ_PROXY_SHARED_SECRET
#
# Do not expose this secret to the browser. Nginx must overwrite the header
# instead of passing through any client-supplied x-aoju-proxy-key value.

location = /health {
    proxy_pass http://127.0.0.1:<BACKEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-aoju-proxy-key "<AOJ_PROXY_SHARED_SECRET>";
}

location = /api/v1/assistant/chat {
    proxy_pass http://127.0.0.1:<BACKEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-aoju-proxy-key "<AOJ_PROXY_SHARED_SECRET>";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no;
}

location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:<BACKEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-aoju-proxy-key "<AOJ_PROXY_SHARED_SECRET>";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location ^~ /static/ {
    proxy_pass http://127.0.0.1:<BACKEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-aoju-proxy-key "<AOJ_PROXY_SHARED_SECRET>";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
