# AOJUAI BT / Nginx reverse-proxy reference
#
# Current environment example:
# - Next.js frontend: 127.0.0.1:<FRONTEND_PORT>
# - FastAPI backend: 127.0.0.1:<BACKEND_PORT>
#
# How to use with BT:
# 1. Keep BT-generated server/SSL/well-known blocks.
# 2. Copy the directives below into the site server {}.
# 3. Replace the frontend/backend ports with the real process ports.
#
# Important:
# - Do NOT add another `location /.well-known/` block. BT already includes its own ACME handler.
# - Nginx is the trusted production boundary. Browser `/api/v1/*` requests go directly to FastAPI.
# - Replace `<AOJ_PROXY_SHARED_SECRET>` with the same value as backend `AOJ_PROXY_SHARED_SECRET`.
# - `/static/` belongs to FastAPI (`static/uploads` etc.), not Next.js.
# - TTS/STT audio responses and assistant SSE are both under `/api/v1/*`, so they must go to Python.
# - Old Vite preview / stale ports such as `38848` should be removed completely.
# - If BT rewrites the main site file, keep backend routes in an extension include.
# - If you keep frontend port random, verify the real Next port with `ss -ltnp`.

# Recommended server-level limits for uploads / audio.
client_max_body_size 50m;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Backend health endpoint.
location = /health {
    proxy_pass http://127.0.0.1:<BACKEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-aoju-proxy-key "<AOJ_PROXY_SHARED_SECRET>";
}

# Assistant streaming endpoint (SSE): buffering must stay off.
location = /api/v1/assistant/chat {
    proxy_pass http://127.0.0.1:<BACKEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-aoju-proxy-key "<AOJ_PROXY_SHARED_SECRET>";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header X-Accel-Buffering no;
}

# All API routes, including:
# - /api/v1/docs
# - /api/v1/redoc
# - /api/v1/openapi.json
# - /api/v1/speech/*
# - /api/v1/upload/*
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:<BACKEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-aoju-proxy-key "<AOJ_PROXY_SHARED_SECRET>";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# FastAPI static mount: uploads and other backend-served static assets.
location ^~ /static/ {
    proxy_pass http://127.0.0.1:<BACKEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-aoju-proxy-key "<AOJ_PROXY_SHARED_SECRET>";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# Next.js build assets.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:<FRONTEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 7d;
    access_log off;
}

# Other Next.js runtime endpoints such as /_next/image.
location ^~ /_next/ {
    proxy_pass http://127.0.0.1:<FRONTEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Frontend pages and public assets.
location / {
    proxy_pass http://127.0.0.1:<FRONTEND_PORT>;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
