phase: design
status: confirmed_architecture_delta

phase_confirmation:
  status: confirmed
  mode: ask-user
  user_questions: []
  auto_filled_for_test: []
  confirmed_decisions:
    - id: AD-007-REV
      text: "首版 StorageAdapter 默认 LocalDisk；OSS 实现可空保留接口，不作为首期（S1）依赖"
    - id: AD-004-LOCK
      text: "rp_credit_* 整数积分流水为商家唯一余额真相；禁用 realphotos 租户走旧 Decimal 消费入口"
    - id: DETECTOR-FIXTURE
      text: "首期（S1） DetectorAdapter=fixture，键名对齐 Gemini 五维合同"
    - id: LAYER-STUB
      text: "首期（S1） ProcessingPipeline=stub，必须产出 sRGB JPEG 字节与预设快照字段"
    - id: WORKER-PG
      text: "PostgreSQL 持久队列 + 同机 worker 进程；禁止前端驱动终态"
    - id: UX-BASELINE
      text: "UI 信息架构沿用 prototype/；本阶段不新开 gpt-image-2 原型请求"
    - id: FR-033-API
      text: "第一版开放本平台业务 API（X-API-Key + image_processing + OpenAPI）；复用 api_keys；退出在 R3/S5；不进首期 S1"
    - id: FLOW-FREEZE-BEFORE-QUEUE
      text: "处理提交短事务内：核余额+冻结+建任务/execution_job；禁止先入队后冻结"
    - id: RBAC-MATRIX-A
      text: "可执行权限矩阵含商家/订单客服A/技术客服/管理员/API Key；订单客服确认拒单、不解冻、不看业务图；已升入 PRD 2.10 §7"
    - id: DUAL-TOKEN
      text: "上游模型 credential_ref 与客户业务 api_keys 物理隔离；关闭上游 Key 自助≠关闭业务 API"
    - id: SCOPE-CAPABILITY-NAME
      text: "api_keys.scopes 落库=能力名（image_processing）；鉴权映射路径白名单；改造底座校验；禁止空/培训默认全集给业务 Key"
    - id: S0-CODING-FREEZE
      text: "未获管理员「授权开 S0」前禁止实现 S0 业务代码"
  accepted_risks:
    - "经济起步同机盘损坏风险已知；上线前手工备份规程"
    - "原型尚无商家业务 API 凭证页；实现 S5 前须补 UI 合同"
    - "禁自评自合须 Owner 网页确认后才算 CI/CD 双账号门禁齐"
  blockers:
    - "s0_coding_authorized=false"
  confirmed_by: user
  confirmed_at: "2026-11-05T01:23:00-05:00"
  change_log:
    - date: "2026-11-04"
      change: "架构合同改为 LocalDisk；记录首期适配器边界"
      reason: "grill Q1/Q7/Q12/Q18/Q26 与物料对齐"
    - date: "2026-11-05"
      change: "登记 FR-033；架构升至 1.5（api_keys 复用 + 处理子集路由）"
      reason: "用户纳入客户业务 API；审计补齐设计缺口"
    - date: "2026-11-05"
      change: "架构升至 1.6：§5.4 首期表裁剪、§5.5 业务流转、§10.2–10.4 权限矩阵/双 Token/支付与图片落点"
      reason: "用户确认补进表结构+流转+角色权限+支付/图片/Token 设计包"
    - date: "2026-11-05"
      change: "架构 1.7 + PRD 2.10：能力名 scopes、§7 订单客服 A、§8.3 LocalDisk 措辞、冻结 S0"
      reason: "grill round-2 Q1–Q5 用户全接受推荐"

knowledge_assets:
  wiki: wiki.md
  phase_summary: "设计阶段以既有原型为 UX 基线；架构 1.7 = LocalDisk 消歧 + 能力名 scope 映射 + 1.6 表/流转/RBAC/双 Token；PRD 2.10 §7 对齐。"
  outcomes:
    - "AD-007 修订为 LocalDisk 默认"
    - "架构 1.6 补齐首期表/流转/权限/双 Token"
    - "架构 1.7 / PRD 2.10：能力名 scopes、订单客服 A 入 PRD、OSS 残句清除"
  lessons:
    - "存储/检测/五层必须适配器化，便于假→真切换"
    - "冻结与入队同属提交事务；队列不等于先排队后扣款"
    - "底座 api_keys 路径前缀语义与 FR-033 能力名合同冲突，须显式改造"
  reusable_rules:
    - "事务内不读盘写大文件到完成；先记意图再落盘"
    - "上游模型 Key ≠ 客户业务 API Key"
    - "scopes 落库=能力名；匹配前先映射路径白名单"
  prompts_or_commands: []
  evidence_links:
    - ../蜜獾原图-v2-项目架构-v1.0.md
    - ../../prototype/README.md
  update_wiki:
    - "更新 Design outcomes（架构 1.6）"

prototype_image_request:
  required: false
  reason: "已有 HTML 交互原型；grilling 未要求新 PNG 集"

system_flow_diagram:
  required: true
  note: "架构 §5.5 Mermaid：登录/API Key→入库→【冻结+入队】→处理→结算/释放→下载；充值人工确认"
  path: ../蜜獾原图-v2-项目架构-v1.0.md
  sections: ["5.4", "5.5", "10.2", "10.3", "10.4"]

product_design:
  product_model: "resource_library -> processing_task (single) -> delivery"
  terminology_decisions:
    - "首期：可编码最小垂直阶段"
    - "租户积分户：同租户共用整数余额"
    - "提交：冻结与入队同事务"
  value_moment: "单张处理结果可下载且按张流水正确"
  non_goals:
    - "首期不含生图/真五层/真 Gemini/OSS"
  model: "resource_library -> processing_task (single) -> delivery"
  service_boundaries:
    - api: "FastAPI realphotos capability"
    - worker: "image/notify/cleanup processes same host"
    - web: "Next.js"
  ux_baseline: "../../prototype/"

service_system_design:
  actors: [merchant, order_support, admin, tech_support_deferred]
  handoffs:
    - "商家或 API Key：资源入库 → 提交（冻结+入队）→ worker 处理 → 结算/释放 → 下载"
    - "商家提交充值订单 → 订单客服确认/拒单 → 租户户加分或取消"
    - "管理员人工加减分（强制原因+幂等）"
  external_systems:
    - "首期无真模型外呼；替身内建"
    - "上游模型凭据仅管理员配置位（credential_ref）；客户业务 Key 走 api_keys"
  manual_backoffice_steps:
    - "管理员加减分"
    - "订单客服确认/拒单"
  failure_recovery:
    - "技术异常：保留冻结；客服审计释放（首期可管理员释放）"
  payment:
    mode: "manual_recharge_confirm"
    not_in_v1: "扫码支付网关 / 现金退款"
  image_management:
    resource_library: "长期保留至删除"
    process_result: "7x24h expires_at；网关校验"
    delivery: "no ZIP；no bare path"
  dual_token:
    upstream_model: "rp_model_config_version.credential_ref"
    customer_business_api: "core api_keys + X-API-Key + image_processing"

interaction_design:
  flows:
    - id: flow-knife-1
      maps_to: [UJ-knife-1]
      steps:
        - login
        - upload
        - submit_single_process
        - view_result_download
      feedback:
        - toast_or_message_on_terminal_state
      validation:
        - hard_file_checks
  state_model:
    default: "idle_resource_list"
    empty: "no_resources_cta_upload"
    loading: "task_running_poll_or_sse"
    error: "terminal_failed_with_reason"
    permission: "role_gated_nav"

information_architecture:
  navigation:
    - 工作台
    - 图片资源
    - 批量原图（单张提交）
    - 任务详情
    - 积分与充值（商家）
    - 工单（订单客服最小）
  hierarchy: ["tenant", "account", "resource", "processing_task"]
  labels: ["沿用 prototype 中文文案"]
  permissions: ["merchant", "order_support", "admin"]

design_spines:
  design_md: prototypes/DESIGN.md
  experience_md: prototypes/EXPERIENCE.md
  visual_board: prototypes/visual-system.html
  status: deferred_use_html_prototype
  notes:
    - "首期不新开 DESIGN/PNG；以 ../../prototype 为 UX 基线"

visual_system:
  style_direction:
    product_category: "ecommerce_ops_tool"
    density: "compact_tables"
    tone: "utilitarian"
    references: ["../../prototype/index.html"]
    anti_references: ["generic_purple_saas_marketing"]
  tokens:
    colors: []
    typography: []
    spacing: []
    radius: []
    icons: []
  component_rules: ["跟随现有 prototype，不在本阶段重做视觉系统"]
  accessibility: ["后续实现时按底座与 WCAG 基本对比度检查"]

architecture:
  stack:
    frontend: "Next.js / React (aojuai)"
    backend: "FastAPI / SQLAlchemy (aojuai)"
    db: "PostgreSQL 16 local"
    storage_default: "LocalDisk"
    storage_reserved: "OSS adapter"
  version: "1.7"
  first_knife_adapters:
    storage: LocalDiskStorageAdapter
    detector: FixtureGeminiDetector
    layers: StubFiveLayerPipeline
    pre_review: AlwaysPassWithAdminForceReject
  data:
    credit_account: "tenant-unique integer"
    isolation: "owner_account_id + tenant_id"
    s0_s1_table_cut: "见架构 §5.4"
    business_flow: "见架构 §5.5；冻结先于或原子于入队"
  security:
    gateway_auth_required: true
    no_bare_disk_urls: true
    rbac_matrix: "见架构 §10.2"
    dual_token: "见架构 §10.3"
  deployment:
    s1_phase: "dev host only (materials 192.168.19.128 / equivalent)"
    production_demo_host: "blocked until Q5 gates"
  decisions:
    - id: ADR-grill-2026-11-04
      decision: "LocalDisk 默认；首期适配器边界；租户整数积分流水"
      rationale: "物料与 grilling 对齐，消除 OSS 合同分叉"
      alternatives_rejected: ["首版强制 OSS", "首期（S1）真五层+真 Gemini 同阶段"]
      maps_to: [GD-001, GD-006, GD-007, GD-018]
    - id: ADR-schema-flow-2026-11-05
      decision: "架构 1.6 补首期表裁剪、业务流转、可执行 RBAC、双 Token、人工支付与图片落点"
      rationale: "用户确认系统设计前置包写入架构而非另起文档"
      alternatives_rejected: ["另开无关 PRD 重写行为", "先入队后冻结"]
  risks:
    - "五层占位实现换真时字段漂移"
    - "同机 LocalDisk 单点"

design_review:
  findings:
    - "既有 HTML 原型可作 IA 基线；本阶段不新开 PNG 原型请求"
    - "冻结→队列顺序经用户确认与 PRD FR-016 一致"
  approved_decisions:
    - "AD-007 LocalDisk"
    - "Detector/Layers 适配器假实现进首期"
    - "架构 1.6 设计前置包"
  rejected_directions:
    - "首期（S1）同时上真五层与真 Gemini"
    - "用前端假进度冒充 ND-018"
    - "先入队再冻结积分"
  spine_checks:
    - "prototype README 与 PRD 2.8 §13.1 对齐为首期范围"

gate:
  ready: true
  blockers: []
