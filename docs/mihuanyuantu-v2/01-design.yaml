phase: design
status: confirmed_architecture_delta

phase_confirmation:
  status: confirmed
  mode: ask-user
  user_questions: []
  auto_filled_for_test: []
  confirmed_decisions:
    - id: AD-007-REV
      text: "首版 StorageAdapter 默认 LocalDisk；OSS 实现可空保留接口，不作为首期（S1）依赖"
    - id: AD-004-LOCK
      text: "rp_credit_* 整数积分流水为商家唯一余额真相；禁用 realphotos 租户走旧 Decimal 消费入口"
    - id: DETECTOR-FIXTURE
      text: "首期（S1） DetectorAdapter=fixture，键名对齐 Gemini 五维合同"
    - id: LAYER-STUB
      text: "首期（S1） ProcessingPipeline=stub，必须产出 sRGB JPEG 字节与预设快照字段"
    - id: WORKER-PG
      text: "PostgreSQL 持久队列 + 同机 worker 进程；禁止前端驱动终态"
    - id: UX-BASELINE
      text: "UI 信息架构沿用 prototype/；本阶段不新开 gpt-image-2 原型请求"
    - id: FR-033-API
      text: "第一版开放本平台业务 API（X-API-Key + image_processing + OpenAPI）；复用 api_keys；退出在 R3/S5；不进首期 S1"
  accepted_risks:
    - "经济起步同机盘损坏风险已知；上线前手工备份规程"
    - "原型尚无商家业务 API 凭证页；实现 S5 前须补 UI 合同"
  blockers: []
  confirmed_by: user
  confirmed_at: "2026-11-04T01:39:00-05:00"
  change_log:
    - date: "2026-11-04"
      change: "架构合同改为 LocalDisk；记录首期适配器边界"
      reason: "grill Q1/Q7/Q12/Q18/Q26 与物料对齐"
    - date: "2026-11-05"
      change: "登记 FR-033；架构升至 1.5（api_keys 复用 + 处理子集路由）"
      reason: "用户纳入客户业务 API；审计补齐设计缺口"

knowledge_assets:
  wiki: wiki.md
  phase_summary: "设计阶段以既有原型为 UX 基线；架构 1.5 含 LocalDisk 与 FR-033 客户业务 API 设计增量。"
  outcomes:
    - "AD-007 修订为 LocalDisk 默认"
  lessons:
    - "存储/检测/五层必须适配器化，便于假→真切换"
  reusable_rules:
    - "事务内不读盘写大文件到完成；先记意图再落盘"
  prompts_or_commands: []
  evidence_links:
    - ../蜜獾原图-v2-项目架构-v1.0.md
    - ../../prototype/README.md
  update_wiki:
    - "更新 Design outcomes"

prototype_image_request:
  required: false
  reason: "已有 HTML 交互原型；grilling 未要求新 PNG 集"

system_flow_diagram:
  required: true
  note: "沿用架构文档 Mermaid；LocalDisk 与 FR-033 以架构 1.5 为准"
  path: ../蜜獾原图-v2-项目架构-v1.0.md

product_design:
  product_model: "resource_library -> processing_task (single) -> delivery"
  terminology_decisions:
    - "首期：可编码最小垂直阶段"
    - "租户积分户：同租户共用整数余额"
  value_moment: "单张处理结果可下载且按张流水正确"
  non_goals:
    - "首期不含生图/真五层/真 Gemini/OSS"
  model: "resource_library -> processing_task (single) -> delivery"
  service_boundaries:
    - api: "FastAPI realphotos capability"
    - worker: "image/notify/cleanup processes same host"
    - web: "Next.js"
  ux_baseline: "../../prototype/"

service_system_design:
  actors: [merchant, order_support, admin]
  handoffs:
    - "商家提交处理 → worker 执行 → 消息通知商家"
    - "商家提交充值订单 → 订单客服确认 → 租户户加分"
  external_systems:
    - "首期无真模型外呼；替身内建"
  manual_backoffice_steps:
    - "管理员加减分"
    - "订单客服确认/拒单"
  failure_recovery:
    - "技术异常替身：冻结待后续客服阶段释放（首期可管理员释放）"

interaction_design:
  flows:
    - id: flow-knife-1
      maps_to: [UJ-knife-1]
      steps:
        - login
        - upload
        - submit_single_process
        - view_result_download
      feedback:
        - toast_or_message_on_terminal_state
      validation:
        - hard_file_checks
  state_model:
    default: "idle_resource_list"
    empty: "no_resources_cta_upload"
    loading: "task_running_poll_or_sse"
    error: "terminal_failed_with_reason"
    permission: "role_gated_nav"

information_architecture:
  navigation:
    - 工作台
    - 图片资源
    - 批量原图（单张提交）
    - 任务详情
    - 积分与充值（商家）
    - 工单（订单客服最小）
  hierarchy: ["tenant", "account", "resource", "processing_task"]
  labels: ["沿用 prototype 中文文案"]
  permissions: ["merchant", "order_support", "admin"]

design_spines:
  design_md: prototypes/DESIGN.md
  experience_md: prototypes/EXPERIENCE.md
  visual_board: prototypes/visual-system.html
  status: deferred_use_html_prototype
  notes:
    - "首期不新开 DESIGN/PNG；以 ../../prototype 为 UX 基线"

visual_system:
  style_direction:
    product_category: "ecommerce_ops_tool"
    density: "compact_tables"
    tone: "utilitarian"
    references: ["../../prototype/index.html"]
    anti_references: ["generic_purple_saas_marketing"]
  tokens:
    colors: []
    typography: []
    spacing: []
    radius: []
    icons: []
  component_rules: ["跟随现有 prototype，不在本阶段重做视觉系统"]
  accessibility: ["后续实现时按底座与 WCAG 基本对比度检查"]

architecture:
  stack:
    frontend: "Next.js / React (aojuai)"
    backend: "FastAPI / SQLAlchemy (aojuai)"
    db: "PostgreSQL 16 local"
    storage_default: "LocalDisk"
    storage_reserved: "OSS adapter"
  first_knife_adapters:
    storage: LocalDiskStorageAdapter
    detector: FixtureGeminiDetector
    layers: StubFiveLayerPipeline
    pre_review: AlwaysPassWithAdminForceReject
  data:
    credit_account: "tenant-unique integer"
    isolation: "owner_account_id + tenant_id"
  security:
    gateway_auth_required: true
    no_bare_disk_urls: true
  deployment:
    s1_phase: "dev host only (materials 192.168.19.128 / equivalent)"
    production_demo_host: "blocked until Q5 gates"
  decisions:
    - id: ADR-grill-2026-11-04
      decision: "LocalDisk 默认；首期适配器边界；租户整数积分流水"
      rationale: "物料与 grilling 对齐，消除 OSS 合同分叉"
      alternatives_rejected: ["首版强制 OSS", "首期（S1）真五层+真 Gemini 同阶段"]
      maps_to: [GD-001, GD-006, GD-007, GD-018]
  risks:
    - "五层占位实现换真时字段漂移"
    - "同机 LocalDisk 单点"

design_review:
  findings:
    - "既有 HTML 原型可作 IA 基线；本阶段不新开 PNG 原型请求"
  approved_decisions:
    - "AD-007 LocalDisk"
    - "Detector/Layers 适配器假实现进首期"
  rejected_directions:
    - "首期（S1）同时上真五层与真 Gemini"
    - "用前端假进度冒充 ND-018"
  spine_checks:
    - "prototype README 与 PRD 2.8 §13.1 对齐为首期范围"

gate:
  ready: true
  blockers: []
