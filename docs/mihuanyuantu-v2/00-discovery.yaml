phase: discovery
status: confirmed

phase_confirmation:
  status: confirmed
  mode: ask-user
  user_questions: []
  auto_filled_for_test: []
  confirmed_decisions:
    - id: GD-001
      text: 首版对象存储 = LocalDisk 默认；OSS 仅适配器预留（对齐生产物料）
    - id: GD-002
      text: 积分按租户共用；PRD 删除「无共享钱包产品化」误导措辞，改为无席位订阅但同租户共用积分户
    - id: GD-003
      text: 第一刀 = 上传入库→单张处理→检测夹具→按张账本→下载；生图与运营后置
    - id: GD-004
      text: 正式开发前补订单客服 A 档（RBAC+最小确认/拒单）；完整运营壳后置
    - id: GD-005
      text: ND-011 或真五层 ND-020/021 无归档证据则禁止生产收费与对外检测承诺
    - id: GD-006
      text: 第一刀五层用假桩；真五层在独立算法证据切片（A）
    - id: GD-007
      text: 第一刀 Gemini = GeminiRedoPolicy 同规则确定性夹具
    - id: GD-008
      text: 第一刀 ≤3 套启用预设；405 运营不进退出条件
    - id: GD-009
      text: 订单客服能确认/拒单与看凭证；不能解冻、看图、改权限、碰模型/预设/系统
    - id: GD-010
      text: 第一刀入账 = 管理员人工加减分 + 订单客服确认充值（无跳转支付）
    - id: GD-011
      text: 第一刀只验收单张；不做自动重做/主动重处理
    - id: GD-012
      text: 任务落库 + 同机后台消费者；禁止纯前端假进度
    - id: GD-013
      text: 同租户 2 商家账号证明共用积分与账号隔离；另需第二租户证明跨租户拒绝
    - id: GD-014
      text: 第一刀必验角色含商家×2、订单客服、管理员；技术客服延后
    - id: GD-015
      text: 真会话登录（验证码可开发简化）；假五层仍须 sRGB JPG+快照+五维报告结构
    - id: GD-016
      text: 处理完成/未通过/技术异常写站内消息（账号隔离）
    - id: GD-017
      text: Q25 冻结列表不作为第一刀退出条件
    - id: GD-018
      text: rp_credit_* 整数账本唯一真相；写入 expires_at 并拒绝过期下载；可软删空闲资源
    - id: GD-019
      text: 预审桩默认通过，管理员可强制拒绝；完整冻号计数不验收
    - id: GD-020
      text: 第一刀仅开发机验收；微决策（夹具注入、双账号并发冒烟、开发验证码）已认可
  accepted_risks:
    - 租户共用积分导致店内误花/盗用是产品选择
    - ND-016 跳过版权声明，法务风险仍在
    - 假五层换真时仍可能有字段漂移残余风险
  blockers: []
  confirmed_by: user
  confirmed_at: "2026-11-04T01:39:00-05:00"
  change_log:
    - date: "2026-11-04"
      change: grill-me 会话结束；discovery 确认
      reason: 用户回复 A 并认可微决策

