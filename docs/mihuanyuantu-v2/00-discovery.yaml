    - 同步 Decision Ledger 与第一刀定义

clarification:
  policy: ask-user
  questions_to_ask: []
  auto_filled_for_test: []
  pending_user_decisions: []

idea_forge:
  idea: "蜜獾原图 v2：资源入库与硬件化处理分拆的多租户 Web SaaS"
  assumptions:
    - 商家愿意为「处理通过」按张付积分
    - 开发机可完成第一刀验收而不依赖生产 OSS
  cracks:
    - 真模型中国大陆可用性与成本（ND-011 PENDING）
    - 真五层保真与字节下限未小样验证
    - 共用积分的运营纠纷
  locks:
    - aojuai 底座栈
    - Gemini 为生产检测器决策（真调用仍待证据）
    - 禁止 ZIP；GPS 只随预设；生图不自动处理
  kill_criteria:
    - 无 ND-011/020/021 归档证据仍对外收费或宣称检测通过
  fast_evidence:
    - HTML 原型已验证 IA（非后端证据）
    - 405 预设源文件存在且 total=405

business_case:
  problem: "电商商家需要可追溯的设备参数化图片处理与积分结算，旧版不可恢复队列与合同分叉不可直接上线"
  target_outcome: "开发机可演示并验收第一刀单张闭环；生产仅在门禁证据齐全后开放"
  expected_value: "可审计处理链 + 按张计费，支撑人工充值商业化"
  current_alternative: "旧版系统 / 纯手工改图（不在本仓库实现范围内）"
  constraints:
    platform: "中国大陆 Web；简体中文"
    timeline: "仅相对里程碑；无日历承诺（ND-030）"
    budget_or_effort: "经济起步；不开 OSS/Redis/LB"
    integrations:
      - 人工微信/支付宝转账确认（第一刀极简）
      - 模型渠道后置真调用
    data_security:
      - 图片经应用网关鉴权读盘
      - Key 不进客户可见面

governance:
  roles:
    executive: "项目负责人（管理员裁决来源）"
    product_owner: "产品负责人"
    delivery_owner: "技术负责人"
    design_owner: "UX / 原型（现行 prototype）"
    reviewer: "验收负责人"
  tolerances:
    scope: "第一刀不得吞并 Q25 冻结项"
    schedule: "无固定上线日"
    effort_cost: "经济起步单机"
    quality: "第一刀允许夹具；生产不允许无证据宣称"
    risk: "接受共用积分与 ND-016 范围外版权风险"
    privacy_security: "租户+账号隔离为 P0"
  decision_log:
    - id: grill-2026-11-04
      summary: "见 architecture_decisions/蜜獾原图-v2-grill-me逻辑架构裁决-2026-11-04.md"

prd:
  product_name: "蜜獾原图 v2"
  promise: "先入库再硬件化处理；按张积分；检测报告可审计；不承诺第三方平台审核结果"
  glossary:
    - term: 第一刀
      definition: "本工作区定义的最小可验收实现切片"
    - term: 图片资源
      definition: "租户资源库原图；处理另提交"
    - term: 租户积分户
      definition: "同租户账号共用的整数余额账户"

target_users:
  primary:
    - 电商商家账号
  secondary:
    - 订单客服（A 档）
    - 平台管理员
  excluded_for_mvp:
    - 技术客服（第一刀不验收）
    - 需要生成即硬件化交付的旧路径客户

roles:
  - id: merchant
    name: 商家
    permissions: [resource.upload, task.process_single, credits.read, history.self, messages.self]
  - id: order_support
    name: 订单客服
    permissions: [order.ticket.read, order.confirm, order.reject]
  - id: admin
    name: 平台管理员
    permissions: [credits.adjust, fixture.inject, user.seed, preset.seed]
  - id: tech_support
    name: 技术客服
    permissions: [deferred]

journeys:
  - id: UJ-knife-1
    role: merchant
    entry_state: "已登录；租户有可用积分（人工或订单客服入账）"
    path:
      - 本地上传入库（硬校验）
      - 选择启用预设（≤3）
      - 提交单张处理
      - 预审桩通过
      - 假五层产出 JPG
      - 检测夹具出报告
      - 通过则扣 10；未通过释放
      - 站内消息 + 下载
    value_moment: "获得可下载处理结果与按张流水"
    edge_cases:
      - 管理员注入检测未通过/技术异常
      - 预审强制拒绝不扣处理分
      - 过期后下载拒绝
      - 运行中禁止删资源

requirements:
  functional:
    - id: FR-K1-001
      statement: "商家可本地上传合法图片入库"
      maps_to: [UJ-knife-1]
      acceptance:
        - id: AC-K1-001
          scenario: "非法格式/超限被前后端拒绝且不建资产"
    - id: FR-K1-002
      statement: "单张处理任务落库并由同机 worker 推到终态"
      maps_to: [UJ-knife-1]
      acceptance:
        - id: AC-K1-002
          scenario: "请求返回后关闭页面，任务仍可达终态"
    - id: FR-K1-003
      statement: "按张冻结/结算 10 积分；租户户共用"
      maps_to: [UJ-knife-1]
      acceptance:
        - id: AC-K1-003
          scenario: "账号 B 消耗账号 A 入账积分；流水记操作账号"
    - id: FR-K1-004
      statement: "跨租户访问资源/任务/余额/下载一律拒绝"
      maps_to: [UJ-knife-1]
      acceptance:
        - id: AC-K1-004
          scenario: "第二租户令牌读第一租户对象返回拒绝"
  non_functional:
    - id: NFR-K1-001
      category: security
      statement: "图片只经鉴权网关读 LocalDisk；不暴露裸路径"
    - id: NFR-K1-002
      category: reliability
      statement: "第一刀不承诺跨机备份/RPO；生产收费前须有手工备份规程说明"

mvp_scope:
  in:
    - 真会话登录（开发验证码可）
    - 本地上传 + 硬校验
    - ≤3 预设
    - 单张处理状态机 + 假五层交付合同
    - Gemini 规则夹具（管理员可注入）
    - rp_credit 整数账本
    - 订单客服最小确认充值 + 管理员加减分
    - 站内消息（完成/失败/技术异常）
    - LocalDisk 网关下载与过期拒绝
    - 资源软删（无运行任务）
    - 双商家账号 + 第二租户隔离种子
  out: []
  deferred:
    - 文生图/图生图/提示词优化
    - URL 真导入
    - 405 预设运营
    - 真预审/冻号/技术客服台
    - 真五层（算法证据切片）
    - 真 Gemini（检测门禁切片）
    - 自动重做/主动重处理
    - 混合批次 2–10
    - ZIP/OSS/扫码支付/运营大盘
    - 客户业务 API（FR-033：X-API-Key + image_processing；属第一版，退出在 R3/S5，不进第一刀）

success_metrics:
  - id: SM-K1-001
    metric: "第一刀退出清单项全部有可重复手工/自动证据"
    target: "开发机 100% 清单覆盖"
    counter_metric: "不得用原型 localStorage 冒充后端证据"
  - id: SM-K1-002
    metric: "生产环境未在门禁前开放收费"
    target: "exif-demo 无未门禁收费流量"
    counter_metric: "UI 完成率"

assumptions:
  - 生产物料中的开发机 IP/路径登记继续有效
  - 现行 HTML 原型仅作 IA 参考

open_questions: []

gate:
  ready: true
  blockers: []
