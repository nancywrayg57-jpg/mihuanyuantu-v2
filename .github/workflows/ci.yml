name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'aojuai-main/backend/**'
            frontend:
              - 'aojuai-main/frontend/**'
            docs:
              - 'AGENTS.md'
              - 'anchor.md'
              - 'checkpoint.md'
              - 'handoff.md'
              - 'docs/mihuanyuantu-v2/**'
              - '.github/workflows/**'
              - 'scripts/ci/**'

  secrets_gate:
    name: A secrets red-line
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for forbidden secret paths and patterns
        run: bash scripts/ci/secret_scan.sh

  backend:
    name: B backend ruff+pytest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aojuai-main/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            aojuai-main/backend/requirements.txt
            aojuai-main/backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Ruff
        run: ruff check .
      - name: Pytest (sqlite)
        env:
          DB_DRIVER: sqlite
          SQLITE_PATH: ":memory:"
        run: pytest

  frontend:
    name: C frontend typecheck+test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aojuai-main/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: aojuai-main/frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  docs_gate:
    name: D docs gate
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required gate files exist
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/mihuanyuantu-v2/DEV_INSTRUCTIONS.md
          test -f docs/mihuanyuantu-v2/progress.yaml
          test -f docs/mihuanyuantu-v2/wiki.md

  ci_gate:
    name: CI gate
    needs: [changes, secrets_gate, backend, frontend, docs_gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required checks
        env:
          SECRETS_GATE: ${{ needs.secrets_gate.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCS_GATE: ${{ needs.docs_gate.result }}
        run: |
          set -euo pipefail
          echo "secrets_gate=${SECRETS_GATE}"
          echo "backend=${BACKEND}"
          echo "frontend=${FRONTEND}"
          echo "docs_gate=${DOCS_GATE}"

          if [[ "${SECRETS_GATE}" != "success" ]]; then
            echo "::error::A secrets red-line failed"
            exit 1
          fi

          ok_or_skip() {
            local name="$1" result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Job ${name} ended with ${result}"
                exit 1
                ;;
            esac
          }

          ok_or_skip backend "${BACKEND}"
          ok_or_skip frontend "${FRONTEND}"
          ok_or_skip docs_gate "${DOCS_GATE}"

          echo "CI gate passed"
