name: Deploy stub

on:
  push:
    tags:
      - "v2.*"

jobs:
  stub:
    name: Stub deploy on v2.M.P tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag shape
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Tag: ${TAG}"
          if [[ ! "${TAG}" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match v2.M.P (example v2.0.1); got ${TAG}"
            exit 1
          fi
      - name: Stub deploy (no production side effects)
        run: |
          set -euo pipefail
          cat <<EOF
          ========================================
          STUB DEPLOY — intentional no-op
          Tag: ${GITHUB_REF_NAME}
          SHA: ${GITHUB_SHA}
          Actor: ${GITHUB_ACTOR}
          ----------------------------------------
          Real production deploy still requires:
            - DEV_INSTRUCTIONS S7
            - launch gate (section 11)
            - admin confirmation
          Owner only: @nancywrayg57-jpg
          ========================================
          EOF
